name = "mrd-proxy"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# 目前部署在 mrd-proxy.jjqwekimo.workers.dev
workers_dev = true

# 若你的 Cloudflare 帳號有多個,取消註解並填入 account id
# account_id = "6cab06ca4aac281a97a73d764cd48ce4"

# 使用查詢次數計數器(/count 路由)。namespace 名稱是 "xueshan-usage"。
# 取得 id:  npx wrangler kv namespace list   (找 title="xueshan-usage" 那筆的 id)
# 或 dashboard → Storage & Databases → KV → 點 xueshan-usage,ID 在頁面上。
kv_namespaces = [
  { binding = "USAGE_KV", id = "PUT_xueshan-usage_ID_HERE" }
]

# --- Secrets(不寫在這裡,用指令設定,見 README)---
#   ANTHROPIC_API_KEY   MRD AI 分析
#   APP_TOKEN           團隊通行碼
#   TDX_CLIENT_ID       TDX 平台 Client Id
#   TDX_CLIENT_SECRET   TDX 平台 Client Secret
#   CWA_API_KEY         中央氣象署開放資料授權碼(/weather 路由)
