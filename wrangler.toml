name = "mrd-proxy"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# 目前部署在 mrd-proxy.jjqwekimo.workers.dev
workers_dev = true

# 若你的 Cloudflare 帳號有多個,取消註解並填入 account id
# account_id = "6cab06ca4aac281a97a73d764cd48ce4"

# /count 路由的計數器。namespace 名稱 = "xueshan-usage"(裡面有個 key usage_count)。
#
# ⚠️ 只有要改用 `wrangler deploy` 時才需要填下面的 id。目前線上是走 CF dashboard,
#    這個 repo 純版本控制,id 空著不影響。
#
# 取得 namespace id(不是裡面的 key,是 namespace 自己的識別碼,32 位十六進位):
#   dashboard → Storage & Databases → KV → 列表裡 "xueshan-usage" 那列的 "Namespace ID" 欄
#   或裝好 wrangler 後:  npx wrangler kv namespace list
kv_namespaces = [
  { binding = "USAGE_KV", id = "TODO-僅 wrangler deploy 時需要" }
]

# --- Secrets(不寫在這裡,用指令設定,見 README)---
#   ANTHROPIC_API_KEY   MRD AI 分析
#   APP_TOKEN           團隊通行碼
#   TDX_CLIENT_ID       TDX 平台 Client Id
#   TDX_CLIENT_SECRET   TDX 平台 Client Secret
#   CWA_API_KEY         中央氣象署開放資料授權碼(/weather 路由)
