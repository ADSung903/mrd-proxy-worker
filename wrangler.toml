name = "mrd-proxy"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# 目前部署在 mrd-proxy.jjqwekimo.workers.dev
workers_dev = true

# 若你的 Cloudflare 帳號有多個,取消註解並填入 account id
# account_id = "6cab06ca4aac281a97a73d764cd48ce4"

# /count 路由的計數器。namespace 名稱 = "xueshan-usage"(裡面有個 key usage_count)。
kv_namespaces = [
  { binding = "USAGE_KV", id = "a5113e89498346b88f990b473a970134" }
]

# --- Secrets(不寫在這裡,用指令設定,見 README)---
#   ANTHROPIC_API_KEY   MRD AI 分析
#   APP_TOKEN           團隊通行碼
#   TDX_CLIENT_ID       TDX 平台 Client Id
#   TDX_CLIENT_SECRET   TDX 平台 Client Secret
#   CWA_API_KEY         中央氣象署開放資料授權碼(/weather 路由)
